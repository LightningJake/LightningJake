<svg xmlns="http://www.w3.org/2000/svg" width="420" height="200" viewBox="0 0 420 200" role="img" aria-label="PortiPark">
<style>
    .sweep { animation: sweep 5s ease-in-out infinite; }
    @keyframes sweep { 0% { transform: translateX(-160px) } 60%, 100% { transform: translateX(580px) } }
    </style>
<defs>
  <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#0A0F1F"/><stop offset="1" stop-color="#141C3A"/></linearGradient>
  <linearGradient id="shine" x1="0" x2="1"><stop offset="0" stop-color="#fff" stop-opacity="0"/><stop offset=".5" stop-color="#fff" stop-opacity=".06"/><stop offset="1" stop-color="#fff" stop-opacity="0"/></linearGradient>
  <clipPath id="clip"><rect width="420" height="200" rx="16"/></clipPath>
</defs>
<g clip-path="url(#clip)">
<rect width="420" height="200" fill="url(#bg)"/>
<rect width="420" height="4" fill="#4ADE80"/>
<rect class="sweep" x="0" y="0" width="140" height="200" fill="url(#shine)" transform="skewX(-20)"/>
</g>
<rect x=".5" y=".5" width="419" height="199" rx="16" fill="none" stroke="#26304D"/>
<text x="24" y="38" font-family="ui-monospace, SFMono-Regular, 'Cascadia Code', Consolas, 'DejaVu Sans Mono', monospace" font-size="11.5" letter-spacing="1.5" fill="#4ADE80" font-weight="700">FULL-STACK</text>
<text x="24" y="70" font-family="'Segoe UI', Ubuntu, 'Helvetica Neue', Arial, sans-serif" font-size="25" font-weight="800" fill="#E6EDF3">PortiPark</text>
<text x="396" y="70" text-anchor="end" font-family="'Segoe UI', Ubuntu, 'Helvetica Neue', Arial, sans-serif" font-size="20" fill="#8B95A7">↗</text>
<text x="24" y="100" font-family="'Segoe UI', Ubuntu, 'Helvetica Neue', Arial, sans-serif" font-size="14.5" fill="#8B95A7">Office parking reservations on an interactive</text>
<text x="24" y="121" font-family="'Segoe UI', Ubuntu, 'Helvetica Neue', Arial, sans-serif" font-size="14.5" fill="#8B95A7">floor grid: book, manage and check in to</text>
<text x="24" y="142" font-family="'Segoe UI', Ubuntu, 'Helvetica Neue', Arial, sans-serif" font-size="14.5" fill="#8B95A7">parking spots, with JWT auth.</text>
<rect x="24" y="160" width="73" height="24" rx="12" fill="#0F1730" stroke="#26304D"/><text x="60.5" y="176" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, 'Cascadia Code', Consolas, 'DejaVu Sans Mono', monospace" font-size="12" fill="#E6EDF3">FastAPI</text>
<rect x="105" y="160" width="96" height="24" rx="12" fill="#0F1730" stroke="#26304D"/><text x="153.0" y="176" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, 'Cascadia Code', Consolas, 'DejaVu Sans Mono', monospace" font-size="12" fill="#E6EDF3">PostgreSQL</text>
<rect x="209" y="160" width="96" height="24" rx="12" fill="#0F1730" stroke="#26304D"/><text x="257.0" y="176" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, 'Cascadia Code', Consolas, 'DejaVu Sans Mono', monospace" font-size="12" fill="#E6EDF3">React + TS</text>
</svg>