<svg xmlns="http://www.w3.org/2000/svg" width="900" height="420" viewBox="0 0 900 420" role="img" aria-label="Animated terminal: whoami, focus areas and an LLM evaluation run">
<style>
    text { font-family: ui-monospace, SFMono-Regular, 'Cascadia Code', Consolas, 'DejaVu Sans Mono', monospace; font-size: 15px; white-space: pre; }
    .all { animation: all 20.0s linear infinite; }
    @keyframes all { 0%, 95% { opacity: 1 } 99%, 100% { opacity: 0 } }
    .cursor { animation: blink 1s steps(1) infinite; }
    @keyframes blink { 50% { opacity: 0 } }
    @keyframes s0 { 0%, 2.95% { opacity: 0 } 3.00%, 100% { opacity: 1 } } .s0 { animation: s0 20.0s linear infinite; }@keyframes c0 { 0%, 3.00% { transform: translateX(0) } 5.00%, 100% { transform: translateX(65px) } } .c0 { animation: c0 20.0s steps(1) infinite; animation-timing-function: steps(6, end); }@keyframes o1 { 0%, 7.50% { opacity: 0; transform: translateX(-6px) } 8.75%, 100% { opacity: 1; transform: none } } .o1 { animation: o1 20.0s ease-out infinite; }@keyframes s2 { 0%, 11.95% { opacity: 0 } 12.00%, 100% { opacity: 1 } } .s2 { animation: s2 20.0s linear infinite; }@keyframes c2 { 0%, 12.00% { transform: translateX(0) } 15.38%, 100% { transform: translateX(148px) } } .c2 { animation: c2 20.0s steps(1) infinite; animation-timing-function: steps(15, end); }@keyframes o3 { 0%, 17.50% { opacity: 0; transform: translateX(-6px) } 18.75%, 100% { opacity: 1; transform: none } } .o3 { animation: o3 20.0s ease-out infinite; }@keyframes s4 { 0%, 22.45% { opacity: 0 } 22.50%, 100% { opacity: 1 } } .s4 { animation: s4 20.0s linear infinite; }@keyframes c4 { 0%, 22.50% { transform: translateX(0) } 31.05%, 100% { transform: translateX(360px) } } .c4 { animation: c4 20.0s steps(1) infinite; animation-timing-function: steps(38, end); }@keyframes o5 { 0%, 33.00% { opacity: 0; transform: translateX(-6px) } 34.25%, 100% { opacity: 1; transform: none } } .o5 { animation: o5 20.0s ease-out infinite; }@keyframes o6 { 0%, 35.00% { opacity: 0; transform: translateX(-6px) } 36.25%, 100% { opacity: 1; transform: none } } .o6 { animation: o6 20.0s ease-out infinite; }@keyframes o7 { 0%, 37.00% { opacity: 0; transform: translateX(-6px) } 38.25%, 100% { opacity: 1; transform: none } } .o7 { animation: o7 20.0s ease-out infinite; }@keyframes o8 { 0%, 39.00% { opacity: 0; transform: translateX(-6px) } 40.25%, 100% { opacity: 1; transform: none } } .o8 { animation: o8 20.0s ease-out infinite; }@keyframes o9 { 0%, 42.00% { opacity: 0; transform: translateX(-6px) } 43.25%, 100% { opacity: 1; transform: none } } .o9 { animation: o9 20.0s ease-out infinite; }@keyframes o10 { 0%, 46.00% { opacity: 0; transform: translateX(-6px) } 47.25%, 100% { opacity: 1; transform: none } } .o10 { animation: o10 20.0s ease-out infinite; }@keyframes s11 { 0%, 49.95% { opacity: 0 } 50.00%, 100% { opacity: 1 } } .s11 { animation: s11 20.0s linear infinite; }</style>
